<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8131e"/>
      <stop offset="1" stop-color="#990008"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc940"/>
      <stop offset="1" stop-color="#f39a10"/>
    </linearGradient>
    <pattern id="chk" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#fff"/><rect x="36" y="36" width="36" height="36" fill="#fff"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm"><rect width="1024" height="1024" fill="url(#fade)"/></mask>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3d0003" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#chk)" opacity=".12" mask="url(#fm)"/>
  <!-- Ladefläche -->
  <rect x="168" y="770" width="688" height="30" rx="15" fill="#ffffff"/>
  <g filter="url(#sh)">
    <!-- Ladung -->
    <rect x="300" y="318" width="424" height="452" rx="34" fill="url(#box)"/>
    <rect x="300" y="468" width="424" height="12" fill="#cfd4da"/>
    <rect x="300" y="620" width="424" height="12" fill="#cfd4da"/>
    <!-- Zurrgurt -->
    <path d="M232 785 L300 318 L724 318 L792 785" fill="none" stroke="#b06f00" stroke-width="64" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M232 785 L300 318 L724 318 L792 785" fill="none" stroke="url(#strap)" stroke-width="46" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Kantenschutz -->
    <path d="M294 396 L294 312 L378 312" fill="none" stroke="#1f1f1f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M730 396 L730 312 L646 312" fill="none" stroke="#1f1f1f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ratsche mit Hebel -->
    <g transform="translate(257 612) rotate(-81.7)">
      <rect x="-70" y="-40" width="140" height="80" rx="16" fill="#1f1f1f"/>
      <rect x="-44" y="-40" width="12" height="80" fill="#4a4d52"/>
      <rect x="-14" y="-40" width="12" height="80" fill="#4a4d52"/>
      <rect x="16" y="-40" width="12" height="80" fill="#4a4d52"/>
      <path d="M58 -30 L150 -96" stroke="#1f1f1f" stroke-width="30" stroke-linecap="round"/>
    </g>
  </g>
</svg>
